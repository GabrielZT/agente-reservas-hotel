<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de Reservas</title>
<style>
  :root { --azul: #1e3a5f; --fundo: #f3f4f6; --usuario: #dbeafe; --agente: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: var(--fundo); color: #111; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { background: var(--azul); color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 2px 0 0; font-size: .85rem; opacity: .85; }
  #mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
  .user { align-self: flex-end; background: var(--usuario); }
  .model { align-self: flex-start; background: var(--agente); border: 1px solid #e5e7eb; }
  .erro { align-self: center; color: #b91c1c; font-size: .9rem; }
  .aguarde { align-self: flex-start; color: #555; font-size: .85rem; font-style: italic; }
  .ferramentas { font-size: .75rem; color: #555; margin-top: 6px; }
  #exemplos { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: #fff; border-top: 1px solid #e5e7eb; }
  #exemplos button { background: #eef2f7; color: var(--azul); border: 1px solid #cbd5e1; border-radius: 999px; padding: 5px 10px; font-size: .8rem; }
  .barra { display: flex; justify-content: center; padding: 4px; background: #fff; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { background: var(--azul); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  @media (max-width: 600px) { .msg { max-width: 92%; } }
</style>
</head>
<body>
<header>
  <h1>🏨 Assistente de Reservas</h1>
  <p>Pergunte sobre as reservas do hotel (Kaggle, 2017-2018) ou peça a previsão de cancelamento de uma reserva.</p>
</header>
<main id="mensagens" aria-live="polite"></main>
<!-- além do kit: exemplos clicáveis (preenchem a caixa de texto; o usuário confere e envia) -->
<div id="exemplos" aria-label="Exemplos de perguntas"></div>
<div class="barra"><button id="nova" type="button" style="background:#e5e7eb;color:#111;padding:6px 14px">🧹 Nova conversa</button></div>
<form id="form">
  <input id="entrada" autocomplete="off" maxlength="1000" placeholder="Ex.: Qual segmento de mercado cancela mais?" required>
  <button id="enviar">Enviar</button>
</form>
<script>
  const historico = [];                       // [{papel: "user"|"model", texto}]
  const caixa = document.getElementById("mensagens");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const botao = document.getElementById("enviar");
  const EXEMPLOS = [
    "Qual a taxa de cancelamento por segmento de mercado?",
    "Quantas reservas Online com mais de 100 dias de antecedência foram canceladas?",
    "Reserva online feita 2 semanas antes, diária de 120 euros, sem pedidos especiais, chegada em julho, 1 noite de fim de semana e 2 de semana, sem vaga. Vai cancelar?",
    "Esse modelo é confiável?",
  ];

  function mostrar(texto, classe, etapas) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    div.textContent = texto;                  // textContent evita injeção de HTML (XSS)
    if (etapas && etapas.length) {               // mostra o que o agente fez: RAG, modelo, verificação...
      const f = document.createElement("div");
      f.className = "ferramentas";
      f.textContent = "🔧 " + etapas.join(" · ");
      div.appendChild(f);
    }
    caixa.appendChild(div);
    caixa.scrollTop = caixa.scrollHeight;
    return div;
  }

  for (const ex of EXEMPLOS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = ex.length > 60 ? ex.slice(0, 57) + "..." : ex;
    b.title = ex;
    b.addEventListener("click", () => { entrada.value = ex; entrada.focus(); });
    document.getElementById("exemplos").appendChild(b);
  }

  const BOAS_VINDAS = "Olá! Posso responder perguntas sobre o dataset de reservas de hotel (taxas de cancelamento, comparações entre grupos, o que a análise encontrou) ou estimar se uma reserva vai ser cancelada. Para a previsão, preciso de: antecedência, preço da diária, pedidos especiais, mês de chegada, noites de fim de semana e de semana, segmento de mercado e se pediu vaga de estacionamento.";
  mostrar(BOAS_VINDAS, "model");
  document.getElementById("nova").addEventListener("click", () => {   // esquece a conversa anterior
    historico.length = 0;
    caixa.innerHTML = "";
    mostrar(BOAS_VINDAS, "model");
  });

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    mostrar(texto, "user");
    entrada.value = "";
    botao.disabled = true;
    const aguarde = mostrar("Consultando os dados...", "aguarde");
    // além do kit: no Render gratuito o app "dorme"; avisa se a resposta demorar
    const acordando = setTimeout(() => { aguarde.textContent = "O servidor pode estar acordando (até 1 minuto na primeira mensagem)..."; }, 8000);
    try {
      const limite = new AbortController();
      const relogio = setTimeout(() => limite.abort(), 55000);      // desiste depois de 55 s
      const r = await fetch("/api/chat", {
        signal: limite.signal,
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto, historico })
      });
      clearTimeout(relogio);
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || "Erro no servidor");
      aguarde.remove();
      mostrar(dados.resposta, "model", dados.etapas);
      historico.push({ papel: "user", texto }, { papel: "model", texto: dados.resposta });
    } catch (e) {
      aguarde.remove();
      mostrar("⚠️ " + (e.name === "AbortError" ? "O servidor demorou demais. Se o app estava dormindo, tente de novo." : e.message), "erro");
    } finally {
      clearTimeout(acordando);
      botao.disabled = false;
      entrada.focus();
    }
  });
</script>
</body>
</html>
